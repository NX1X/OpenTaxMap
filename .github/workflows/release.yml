name: Release

# Manual trigger. Verifies the build, then tags a GitHub release.
#
# This workflow does NOT deploy. The site is deployed by Cloudflare Workers
# Builds, which pulls this repository directly and builds on push to main.
# That means no Cloudflare credentials exist in GitHub at all, and branch
# protection on main is what gates production.
#
# The work is split so no job holds more privilege than it needs:
#   build       - contents: read, runs the build and third-party code
#   tag-release - contents: write, but runs no build and no npm install

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without the v (e.g. v1.2.0 or 1.2.0)."
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 7

  tag-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `gh release create` creates the tag server-side at --target, so this job
      # never needs a git credential on disk - nothing here can push to the repo
      # outside of creating this one release.
      #
      # RELEASE_VERSION goes through env rather than being interpolated straight
      # into the shell, and is validated before use, so a crafted tag name
      # cannot break out into arbitrary commands.
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Accept the input with or without a leading "v" and normalize to vX.Y.Z.
          RELEASE_VERSION="v${RELEASE_VERSION#v}"
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release version '$RELEASE_VERSION'. Expected MAJOR.MINOR.PATCH (with or without a leading v)."
            exit 1
          fi
          VERSION_NUM="${RELEASE_VERSION#v}"

          # package.json is the single source of truth: the tag must match it.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION_NUM" ]; then
            echo "::error::Tag $RELEASE_VERSION does not match package.json version $PKG_VERSION."
            exit 1
          fi

          # Release notes come from the matching CHANGELOG.md section.
          awk -v ver="## [$VERSION_NUM]" '
            index($0, ver) == 1 { grab = 1; next }
            grab && /^## \[/    { exit }
            grab               { print }
          ' CHANGELOG.md > notes.md
          # trim leading/trailing blank lines
          sed -i -e '/./,$!d' notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION_NUM. Add one before releasing."
            exit 1
          fi

          gh release create "$RELEASE_VERSION" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_VERSION" \
            --notes-file notes.md
