name: Release & Deploy

# Manual trigger. Builds the site, deploys to Cloudflare, and optionally
# tags a GitHub release.
#
# Required repository secrets for the deploy job:
#   CLOUDFLARE_API_TOKEN  - token with Workers Scripts:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID - the Cloudflare account id
# Without them the deploy job is skipped (build still runs).
#
# The work is split across three jobs so no single job holds more privilege
# than it needs:
#   build       - no secrets, contents: read
#   deploy      - Cloudflare secrets, contents: read (cannot write to the repo)
#   tag-release - contents: write, but runs no build and no npm install

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.0). Leave blank to deploy without tagging."
        required: false
        default: ""
      deploy:
        description: "Deploy to Cloudflare after building"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers and a main-only deployment branch policy on
    # this environment in repo settings so a deploy needs a second pair of eyes.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # wrangler is a pinned devDependency, so `npm ci` installs the exact
      # lockfile-verified version. This deliberately avoids a third-party deploy
      # action that would fetch its own unpinned wrangler inside the one job
      # that holds the Cloudflare token.
      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      # A step cannot read its own `env:` block from its own `if:`, so the
      # credential-presence check is published as a step output instead.
      - name: Check Cloudflare credentials are configured
        id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: ${{ steps.creds.outputs.ok == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: Report skipped deploy
        if: ${{ steps.creds.outputs.ok != 'true' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - deploy skipped."

  tag-release:
    needs: [build, deploy]
    if: ${{ always() && inputs.version != '' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `gh release create` creates the tag server-side at --target, so this job
      # never needs a git credential on disk - nothing here can push to the repo
      # outside of creating this one release.
      #
      # RELEASE_VERSION goes through env rather than being interpolated straight
      # into the shell, and is validated before use, so a crafted tag name
      # cannot break out into arbitrary commands.
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release tag '$RELEASE_VERSION'. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          gh release create "$RELEASE_VERSION" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes
